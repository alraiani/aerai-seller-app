# Publishes the static marketing site (www/) to Azure Static Web Apps on merge to main.
name: www-deploy

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/www-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy www
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: www
          skip_app_build: true
